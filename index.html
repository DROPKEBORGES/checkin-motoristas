<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in de Motoristas</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 16px;
        }

        .loading {
            color: #0066cc;
            font-weight: bold;
        }

        .success {
            color: green;
            font-weight: bold;
            font-size: 18px;
        }

        .error {
            color: red;
            font-weight: bold;
            font-size: 18px;
        }

        .info {
            font-size: 14px;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>🚚 Check-in de Motoristas</h1>

    <p id="status" class="loading">
        Validando acesso...
    </p>

    <div id="detalhes"></div>

</div>

<script>

    const formsURL =
        "https://forms.cloud.microsoft/r/NFeaJjc6kP";

    const statusElement =
        document.getElementById("status");

    const detalhesElement =
        document.getElementById("detalhes");

    function acessoNegado(ip) {

        statusElement.className = "error";

        statusElement.innerHTML =
            "❌ Acesso não autorizado";

        detalhesElement.innerHTML = `
            <p>
                Conecte-se ao Wi‑Fi <strong>ICL_Guest</strong>
                para realizar o check-in.
            </p>

            <p class="info">
                IP Detectado: ${ip}
            </p>
        `;
    }

    function acessoPermitido(ip) {

        statusElement.className = "success";

        statusElement.innerHTML =
            "✅ Rede autorizada";

        detalhesElement.innerHTML = `
            <p>
                Acesso validado.
                Redirecionando para o formulário...
            </p>

            <p class="info">
                IP Detectado: ${ip}
            </p>
        `;

        setTimeout(() => {
            window.location.href = formsURL;
        }, 2000);
    }

    fetch("https://api.ipify.org?format=json")
        .then(response => response.json())
        .then(data => {

            const ipAtual = data.ip;

            const partes = ipAtual.split(".");
            const ultimoOcteto = partes[3] || "";

            const autorizado104 =
                ipAtual.startsWith("104.28.63.") &&
                ultimoOcteto.startsWith("1");

            const autorizado187 =
                ipAtual.startsWith("187.32.16.");

            const autorizado =
                autorizado104 || autorizado187;

            if (autorizado) {
                acessoPermitido(ipAtual);
            } else {
                acessoNegado(ipAtual);
            }

        })
        .catch(error => {

            console.error(error);

            statusElement.className = "error";

            statusElement.innerHTML =
                "❌ Erro ao validar conexão.";

        });

</script>

</body>
</html>
